name: AREA51 PC - seguridad de sesiones
on:
  push:
    paths:
      - 'lib/pc/**'
      - 'tests/pc-customer-auth.test.mjs'
      - 'tests/pc-auth-closed-beta.test.mjs'
      - 'tests/pc-customer-library.test.mjs'
      - '.github/workflows/pc-auth-tests.yml'
  pull_request:
    paths:
      - 'lib/pc/**'
      - 'tests/pc-customer-auth.test.mjs'
      - 'tests/pc-auth-closed-beta.test.mjs'
      - 'tests/pc-customer-library.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sesiones y codigos
        run: node --experimental-default-type=module --test tests/pc-customer-auth.test.mjs tests/pc-auth-closed-beta.test.mjs tests/pc-customer-library.test.mjs
