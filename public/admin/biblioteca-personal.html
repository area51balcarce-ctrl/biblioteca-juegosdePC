<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Biblioteca personal · AREA 51</title>
<style>body{background:#090f0b;color:#eaf6e9;font:15px system-ui;margin:0}main{max-width:940px;margin:35px auto;padding:20px}a{color:#adff38}.panel{background:#121c15;border:1px solid #405b43;padding:22px;border-radius:12px;margin:18px 0}input,textarea{background:#080f0a;color:#fff;border:1px solid #5b755b;padding:12px;border-radius:6px;box-sizing:border-box;width:100%}textarea{min-height:125px}button{background:#adff38;border:0;color:#0c170a;font-weight:700;padding:12px 17px;border-radius:6px;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5}.muted{color:#b7c8b9}li{padding:12px;border-bottom:1px solid #314234;overflow-wrap:anywhere}.tag{font-size:12px;color:#adff38}label{display:block;margin:14px 0 7px}small{color:#c1cfc1}h1{margin-bottom:5px}</style></head>
<body><main><a href="/admin/dashboard.html">← Volver al administrador</a><h1>👽 Biblioteca personal Torrent / Magnet</h1><p class="muted">Importá varios archivos .torrent y enlaces magnet: de una sola vez. Se guardan en este navegador, sin publicar enlaces en la tienda ni modificar productos existentes.</p>
<section class="panel"><label for="files">Archivos .torrent (selección múltiple)</label><input id="files" type="file" accept=".torrent,application/x-bittorrent" multiple><label for="magnets">Enlaces Magnet (uno por línea)</label><textarea id="magnets" placeholder="magnet:?xt=urn:btih:..."></textarea><button id="import">📥 Importar todo a mi biblioteca privada</button><button id="export">💾 Exportar respaldo JSON</button><label for="restore">Recuperar respaldo JSON</label><input id="restore" type="file" accept=".json,application/json"><p id="status" aria-live="polite" class="muted"></p></section>
<section class="panel"><h2>Mis descargas guardadas</h2><label for="search">Buscar</label><input id="search" placeholder="Nombre de juego o archivo"><p id="count" class="muted"></p><ul id="list" style="list-style:none;padding:0"></ul></section>
<script>
(async()=>{
 const $=id=>document.getElementById(id), DB='a51_personal_torrents_v1',STORE='items';
 function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
 async function transact(mode,fn){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction(STORE,mode),s=t.objectStore(STORE);let result;try{result=fn(s)}catch(e){d.close();reject(e);return}t.oncomplete=()=>{d.close();resolve(result)};t.onerror=()=>{d.close();reject(t.error)}})}
 function all(){return new Promise(async(resolve,reject)=>{try{const d=await db(),t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).getAll();r.onsuccess=()=>{d.close();resolve(r.result)};r.onerror=()=>{d.close();reject(r.error)}}catch(e){reject(e)}})}
 function put(item){return transact('readwrite',s=>s.put(item))}
 function del(id){return transact('readwrite',s=>s.delete(id))}
 function validMagnet(s){try{const u=new URL(s);return u.protocol==='magnet:'&&/^urn:btih:[a-z0-9]{32,40}$/i.test(u.searchParams.get('xt')||'')}catch{return false}}
 async function digest(blob){const bytes=await blob.arrayBuffer();const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,'0')).join('')}
 async function render(){const q=$('search').value.toLowerCase(),items=(await all()).filter(x=>(x.name||'').toLowerCase().includes(q)).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));$('count').textContent=items.length+' registros';$('list').replaceChildren();for(const x of items){const li=document.createElement('li'),head=document.createElement('div');head.textContent=x.name;head.style.fontWeight='bold';li.append(head);const type=document.createElement('div');type.className='tag';type.textContent=x.type==='torrent'?'Archivo .torrent privado':'Enlace Magnet privado';li.append(type);const b=document.createElement('button');b.textContent=x.type==='torrent'?'⬇ Descargar .torrent':'📋 Copiar Magnet';b.onclick=()=>{if(x.type==='torrent'){const url=URL.createObjectURL(x.file),a=document.createElement('a');a.href=url;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}else navigator.clipboard.writeText(x.magnet).then(()=>$('status').textContent='Magnet copiado.').catch(()=>$('status').textContent='No se pudo copiar.')};li.append(b);const rm=document.createElement('button');rm.textContent='Eliminar';rm.style.background='#e7b2b2';rm.onclick=async()=>{if(!confirm('¿Eliminar este registro privado?'))return;await del(x.id);await render()};li.append(rm);$('list').append(li)}}
 $('import').onclick=async()=>{const button=$('import');button.disabled=true;let saved=0,skipped=0,errors=0;try{const existing=new Set((await all()).map(x=>x.id));for(const file of $('files').files){if(!file.name.toLowerCase().endsWith('.torrent')||file.size>10*1024*1024||!file.size){errors++;continue}const id='torrent:'+await digest(file);if(existing.has(id)){skipped++;continue}await put({id,type:'torrent',name:file.name,file,savedAt:new Date().toISOString()});existing.add(id);saved++}for(const raw of $('magnets').value.split(/\r?\n/)){const magnet=raw.trim();if(!magnet)continue;if(!validMagnet(magnet)){errors++;continue}const id='magnet:'+(new URL(magnet).searchParams.get('xt')||'').toLowerCase();if(existing.has(id)){skipped++;continue}await put({id,type:'magnet',name:magnet.slice(0,110),magnet,savedAt:new Date().toISOString()});existing.add(id);saved++}$('status').textContent='Guardados: '+saved+'. Duplicados: '+skipped+'. Inválidos: '+errors+'. Todo permanece privado en este navegador.';await render()}catch(e){$('status').textContent='Error: '+e.message}finally{button.disabled=false}};
 $('export').onclick=async()=>{const items=await all(),out=[];for(const x of items){if(x.type==='torrent'){const buf=await x.file.arrayBuffer();const bytes=new Uint8Array(buf);let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.slice(i,i+8192));out.push({id:x.id,type:x.type,name:x.name,savedAt:x.savedAt,base64:btoa(str)})}else out.push(x)}const blob=new Blob([JSON.stringify({version:1,items:out})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AREA51-biblioteca-personal.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
 $('restore').onchange=async()=>{const f=$('restore').files[0];if(!f)return;try{if(f.size>80*1024*1024)throw Error('Respaldo demasiado grande');const j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.items))throw Error('Formato no reconocido');let count=0;for(const x of j.items){if(!x.id||!['torrent','magnet'].includes(x.type))continue;if(x.type==='torrent'){if(typeof x.base64!=='string')continue;const raw=atob(x.base64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(bytes.length>10*1024*1024)continue;x.file=new File([bytes],x.name||'archivo.torrent',{type:'application/x-bittorrent'});delete x.base64}else if(!validMagnet(x.magnet||''))continue;await put(x);count++}$('status').textContent='Restaurados '+count+' registros.';await render()}catch(e){$('status').textContent='Error al restaurar: '+e.message}};
 $('search').oninput=render;await render();
})().catch(e=>document.getElementById('status').textContent='No se pudo iniciar: '+e.message);
</script></main></body></html>
