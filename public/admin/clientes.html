<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clientes — AREA 51</title><link rel="stylesheet" href="../assets/style.css"><style>
body{padding:26px;max-width:1250px;margin:auto}header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:25px}h1{font-size:27px}.muted{color:var(--text-dim);font-size:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}input{padding:12px;background:var(--bg-elev);color:var(--text);border:1px solid var(--line-bright);min-width:260px;flex:1}.client{border:1px solid var(--line-bright);padding:17px;margin-bottom:12px;background:var(--bg-panel-2)}.client-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.client h2{font-size:15px;overflow-wrap:anywhere}.metrics{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--text-dim)}details{margin-top:13px}summary{cursor:pointer;color:var(--accent)}.order{padding:12px 0;border-top:1px solid var(--line);font-size:12px}.order ul{padding-left:20px}.pill{color:var(--accent);font-size:12px}.error{color:#ff9b9b}
</style></head><body><header><div><div class="a51-brand"><span class="dot"></span> ÁREA 51</div><h1>👤 Clientes y compras</h1><p class="muted">Consultas privadas para soporte posventa · Solo lectura</p></div><a class="btn" href="/admin/dashboard.html">← Volver al catálogo</a></header><div class="controls"><input id="search" type="search" placeholder="Buscar cliente por Gmail o juego" aria-label="Buscar cliente"><button class="btn" id="refresh">Actualizar</button></div><p id="status" class="muted">Verificando acceso…</p><div id="list"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="../assets/config.js"></script><script src="../assets/store.js"></script><script>
(async()=>{
 const session=await a51_requireSession();if(!session)return;
 const admin=await a51_getCurrentAdmin();if(!admin||admin.role==='operator'){document.getElementById('status').textContent='Acceso reservado a administradores.';return;}
 let clients=[];const $=id=>document.getElementById(id);
 const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
 const date=s=>s?new Date(s).toLocaleString('es-AR'):'—';
 function node(tag,text,cls){const x=document.createElement(tag);if(cls)x.className=cls;x.textContent=text;return x;}
 function render(){
  const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();
  const filtered=clients.filter(c=>c.email.includes(q)||c.orders.some(o=>o.items.some(i=>i.name.toLowerCase().includes(q))));
  $('status').textContent=filtered.length+' cliente(s) · '+clients.filter(c=>c.paid_count>0).length+' con compras acreditadas';
  for(const c of filtered){
   const card=node('article','','client'),head=node('div','','client-head'),title=node('h2',c.email),tag=node('span',c.paid_count?'✓ Compró':'Registrado sin compras','pill');
   head.append(title,tag);card.append(head);
   const metrics=node('div','','metrics');
   for(const t of ['Primer acceso: '+date(c.registered_at),'Último acceso: '+date(c.last_access),'Compras acreditadas: '+c.paid_count,'Total pagado: '+money(c.paid_total_ars)])metrics.append(node('span',t));
   card.append(metrics);
   if(c.orders.length){
    const detail=document.createElement('details'),summary=node('summary','Ver historial de pedidos ('+c.orders.length+')');detail.append(summary);
    for(const o of c.orders){const row=node('div','','order');row.append(node('strong',(o.status==='paid'?'✓ Pagado':o.status)+' · '+money(o.total_ars)+' · '+date(o.paid_at||o.created_at)));const ul=document.createElement('ul');for(const i of o.items)ul.append(node('li',i.name+' × '+i.quantity));row.append(ul);detail.append(row);}
    card.append(detail);
   }
   $('list').append(card);
  }
 }
 async function load(){
  $('status').textContent='Cargando clientes…';
  try{const s=await a51_getSession();if(!s?.access_token)throw Error('Sesión vencida');
   const r=await fetch('/api/admin-clientes',{headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'});
   const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Error de consulta');clients=d.clients;render();
  }catch(e){$('status').textContent=e.message;$('status').className='error';}
 }
 $('search').addEventListener('input',render);$('refresh').addEventListener('click',load);await load();
})();
</script></body></html>
