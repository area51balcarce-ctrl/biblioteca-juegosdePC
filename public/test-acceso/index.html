<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AREA 51 | Prueba privada de acceso PC</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#080c1d;color:#f2f4ff}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}
main{width:min(100%,460px);background:#111a34;border:1px solid #6d69a2;border-radius:20px;padding:28px;box-shadow:0 14px 50px #0008}
h1{font-size:1.5rem;margin:0 0 12px}p{line-height:1.5;color:#c6cce5}
label{display:block;margin:18px 0 6px}input{width:100%;border:1px solid #7e88ae;border-radius:10px;padding:13px;background:#0a1025;color:white;font:inherit}
button{background:#a7e8de;color:#10202a;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:15px}
button:disabled{opacity:.5;cursor:wait}.secondary{background:#293456;color:white}
#status{min-height:42px;white-space:pre-wrap}small{color:#a8b3d7}
</style>
</head>
<body>
<main>
<h1>👽 AREA 51 · Acceso de prueba</h1>
<p>Prueba privada de inicio de sesión para la Biblioteca de PC. <strong>No permite compras ni descargas.</strong></p>
<form id="request">
<label for="email">Correo autorizado</label>
<input id="email" type="email" autocomplete="email" value="area51.balcarce@gmail.com" readonly required>
<button type="submit">Solicitar código</button>
</form>
<form id="verify" hidden>
<label for="code">Código recibido por correo</label>
<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required>
<button type="submit">Verificar e ingresar</button>
</form>
<div id="signed" hidden>
<p>Sesión activa: <strong id="identity"></strong></p>
<button class="secondary" id="logout" type="button">Cerrar sesión</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<small>Esta página no habilita ventas. Los códigos vencen a los 10 minutos.</small>
</main>
<script>
'use strict';
const API='/api/mis-compras?action=customer-';
const email=document.getElementById('email');
const status=document.getElementById('status');
const request=document.getElementById('request');
const verify=document.getElementById('verify');
const signed=document.getElementById('signed');
function message(value){status.textContent=value}
function busy(form,on){for(const b of form.querySelectorAll('button'))b.disabled=on}
async function api(action,body){
  const options={method:body?'POST':'GET',credentials:'same-origin',headers:{Accept:'application/json'}};
  if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}
  const response=await fetch(API+action,options);
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Error del servidor ('+response.status+')');
  return data;
}
function showSession(address){
  request.hidden=true;verify.hidden=true;signed.hidden=false;
  document.getElementById('identity').textContent=address;
  message('Sesión de prueba iniciada.');
}
async function refresh(){
  try{const data=await api('session');showSession(data.email)}
  catch{request.hidden=false;verify.hidden=true;signed.hidden=true}
}
request.addEventListener('submit',async event=>{
  event.preventDefault();busy(request,true);message('Solicitando código...');
  try{
    const data=await api('request',{email:email.value});
    if(data.alreadyAuthenticated){await refresh();return}
    verify.hidden=false;message('Revisá el correo e ingresá el código recibido.');
  }catch(error){message(error.message)}
  finally{busy(request,false)}
});
verify.addEventListener('submit',async event=>{
  event.preventDefault();busy(verify,true);message('Verificando...');
  try{
    const data=await api('verify',{email:email.value,code:document.getElementById('code').value});
    showSession(data.email);
  }catch(error){message(error.message)}
  finally{busy(verify,false)}
});
document.getElementById('logout').addEventListener('click',async()=>{
  try{await api('logout',{});signed.hidden=true;verify.hidden=true;request.hidden=false;message('Sesión cerrada.')}
  catch(error){message(error.message)}
});
refresh();
</script>
</body></html>
