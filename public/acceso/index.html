<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AREA 51 | Acceso a tu biblioteca PC</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#080c1d;color:#f2f4ff}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}
main{width:min(100%,460px);background:#111a34;border:1px solid #6d69a2;border-radius:20px;padding:28px;box-shadow:0 14px 50px #0008}
h1{font-size:1.5rem;margin:0 0 12px}p{line-height:1.5;color:#c6cce5}
label{display:block;margin:18px 0 6px}input{width:100%;border:1px solid #7e88ae;border-radius:10px;padding:13px;background:#0a1025;color:white;font:inherit}
button{background:#a7e8de;color:#10202a;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:15px}
button:disabled{opacity:.5;cursor:wait}.secondary{background:#293456;color:white}
#status{min-height:42px;white-space:pre-wrap}small{color:#a8b3d7}

/* AREA 51 - ETAPA 2: identidad visual exclusiva del acceso. Solo CSS. */
:root{background:#050608;color:#f3fff1}
body{
 background-color:#050608;
 background-image:radial-gradient(ellipse at 12% 5%,rgba(72,250,22,.14),transparent 48%),radial-gradient(ellipse at 90% 90%,rgba(229,10,168,.13),transparent 50%),radial-gradient(circle at 22% 31%,rgba(255,255,255,.22) 0 1px,transparent 1.5px);
 background-size:auto,auto,311px 307px;
}
main{background:linear-gradient(155deg,#17111d,#0c1410);border:1px solid #a02b81;box-shadow:0 16px 55px rgba(0,0,0,.55),0 0 22px rgba(230,13,169,.12)}
h1{color:#f6fff1;text-shadow:0 0 17px rgba(72,250,22,.18)}
p{color:#b8cbb9}
label{color:#e2f3df}
input{background:#0c1210;border:1px solid #476b3b;color:#f7fff4}
input:focus-visible{outline:2px solid #48fa16;outline-offset:2px;box-shadow:0 0 15px rgba(72,250,22,.16)}
button{background:#48fa16;color:#091408;border:1px solid #48fa16;box-shadow:0 0 15px rgba(72,250,22,.17)}
button:hover:not(:disabled){background:#7cff4e;box-shadow:0 0 20px rgba(72,250,22,.28)}
button.secondary{background:#241428;color:#ffe5f8;border-color:#b73594}
a{color:#81ff54}
small{color:#aabda9}
@media(max-width:600px){main{padding:21px;border-radius:15px}}

/* AREA 51 - ETAPA 3: formulario adaptado a PWA y pantallas pequenas. Solo CSS. */
@media(max-width:600px){
 body{padding:14px;min-height:100dvh}
 main{width:100%;padding:22px}
 h1{font-size:clamp(1.3rem,6vw,1.55rem)}
 input{min-height:48px;font-size:16px}
 button{min-height:46px;max-width:100%}
}
@media(max-width:360px){body{padding:9px}main{padding:17px}}

/* AREA 51 - ETAPA 4: acabados premium de Acceso. Solo CSS. */
main{position:relative;overflow:hidden}
main::before{
 content:"";position:absolute;left:0;right:0;top:0;height:3px;
 background:linear-gradient(90deg,#48fa16,#81ff55,#e50aa8);
 box-shadow:0 0 12px rgba(72,250,22,.28);pointer-events:none;
}
button:focus-visible,a:focus-visible{outline:2px solid #8bff61;outline-offset:3px}
button:active:not(:disabled){filter:brightness(.94)}
#status:not(:empty){border-left:2px solid #60ff31;padding-left:10px}
</style>
</head>
<body>
<main>
<h1>👽 AREA 51 · Acceso de clientes</h1>
<p>Ingresá con tu correo electrónico para consultar los juegos de tu biblioteca.</p>
<p id="registrationNotice" role="status">Consultando disponibilidad del registro...</p>
<form id="request">
<label for="email">Tu correo electrónico</label>
<input id="email" type="email" autocomplete="email" placeholder="tuemail@ejemplo.com" required>
<button type="submit">Solicitar código</button>
</form>
<form id="verify" hidden>
<label for="code">Código recibido por correo</label>
<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required>
<button type="submit">Verificar e ingresar</button>
</form>
<div id="signed" hidden>
<p>Sesión activa: <strong id="identity"></strong></p>
<button class="secondary" id="logout" type="button">Cerrar sesión</button>
</div>
<p id="status" role="status" aria-live="polite"></p><p><a id="libraryLink" href="/mi-biblioteca/" hidden style="color:#a7e8de">🛸 Ir a Mi Biblioteca</a></p>
<small>Ingresá tu propio correo electrónico. Los códigos de acceso vencen a los 10 minutos.</small>
</main>
<script>
'use strict';
const API='/api/mis-compras?action=customer-';
let registrationEnabled=false;
const email=document.getElementById('email');
const status=document.getElementById('status');
const request=document.getElementById('request');
const verify=document.getElementById('verify');
const signed=document.getElementById('signed');
function message(value){status.textContent=value}
function busy(form,on){for(const b of form.querySelectorAll('button'))b.disabled=on}
async function api(action,body){
  const options={method:body?'POST':'GET',credentials:'same-origin',headers:{Accept:'application/json'}};
  if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}
  const response=await fetch(API+action,options);
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Error del servidor ('+response.status+')');
  return data;
}
function showSession(address){
  request.hidden=true;verify.hidden=true;signed.hidden=false;
  document.getElementById('identity').textContent=address;
  message('Sesión iniciada correctamente.');
  const link=document.getElementById('libraryLink');if(link)link.hidden=false;
}
async function refresh(){
  try{const data=await api('session');showSession(data.email)}
  catch{request.hidden=false;verify.hidden=true;signed.hidden=true;email.value='';}
}
request.addEventListener('submit',async event=>{
  if(!registrationEnabled){event.preventDefault();message('El registro público todavía no está habilitado.');return;}
  event.preventDefault();busy(request,true);message('Solicitando código...');
  try{
    const data=await api('request',{email:email.value});
    if(data.alreadyAuthenticated){await refresh();return}
    verify.hidden=false;message('Revisá el correo e ingresá el código recibido.');
  }catch(error){message(error.message)}
  finally{busy(request,false)}
});
verify.addEventListener('submit',async event=>{
  event.preventDefault();busy(verify,true);message('Verificando...');
  try{
    const data=await api('verify',{email:email.value,code:document.getElementById('code').value});
    showSession(data.email);
  }catch(error){message(error.message)}
  finally{busy(verify,false)}
});
document.getElementById('logout').addEventListener('click',async()=>{
  try{await api('logout',{});signed.hidden=true;verify.hidden=true;request.hidden=false;email.value='';document.getElementById('code').value='';message('Sesión cerrada.')}
  catch(error){message(error.message)}
});
fetch('/api/mis-compras?action=live-checkout-status',{credentials:'same-origin',cache:'no-store'})
 .then(r=>r.ok?r.json():null).then(data=>{
   registrationEnabled=data?.registrationEnabled===true;
   document.getElementById('registrationNotice').textContent=registrationEnabled?'✅ Registro de clientes disponible':'🔒 Registro público en preparación';
   email.disabled=!registrationEnabled;
   request.querySelector('button').disabled=!registrationEnabled;
 }).catch(()=>{
   document.getElementById('registrationNotice').textContent='🔒 Registro no disponible por ahora';
   email.disabled=true;request.querySelector('button').disabled=true;
 });
refresh();
</script>
</body></html>
